<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LectoREE — Bjumper</title>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif;
            background: #F5F6F8;
            color: #1a1a1a;
            font-size: 14px;
            min-height: 100vh;
        }

        /* ── TOPBAR ── */
        .topbar {
            background: #034068;
            border-bottom: 3px solid #09B4E8;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo { display: flex; align-items: center; gap: 10px; }

        .logo-icon {
            width: 34px; height: 34px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        .logo-title {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }

        .logo-sub {
            font-size: 11px;
            color: #a8d8f0;
            margin-top: 1px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid;
            white-space: nowrap;
        }
        .status-badge::before {
            content: '';
            width: 7px; height: 7px;
            border-radius: 50%;
            display: inline-block;
            background: currentColor;
        }
        .status-ok   { color: #059669; background: #ecfdf5; border-color: #a7f3d0; }
        .status-off  { color: #6b7280; background: #f9fafb; border-color: #e5e7eb; }

        /* ── MAIN ── */
        .main {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── LOGIN ── */
        #login-section {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 56px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 40px;
        }

        #login-section h2 {
            font-size: 18px;
            font-weight: 700;
            color: #034068;
        }

        #login-section p {
            font-size: 13px;
            color: #6b7280;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: #034068;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: #023050; }

        /* ── SEARCH ── */
        .search-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
        }

        .search-label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 10px;
        }

        .search-row {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-row:focus-within {
            border-color: #09B4E8;
            box-shadow: 0 0 0 3px rgba(9,180,232,0.12);
        }

        #serial-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: 600;
            color: #034068;
            letter-spacing: 0.05em;
            font-family: 'Roboto Mono', monospace;
        }
        #serial-input::placeholder { color: #d1d5db; font-size: 16px; font-weight: 400; }

        #search-btn {
            background: #034068;
            border: none;
            padding: 0 24px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
            letter-spacing: .3px;
        }
        #search-btn:hover { background: #023050; }

        /* ── LOADING ── */
        #loading { display: none; text-align: center; padding: 32px; }

        .spinner {
            width: 28px; height: 28px;
            border: 2px solid #e5e7eb;
            border-top-color: #09B4E8;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-msg { font-size: 13px; color: #6b7280; }

        /* ── RESULT ── */
        #result-section { display: none; }

        .result-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .result-header {
            background: #034068;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-sn {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.05em;
            font-family: 'Roboto Mono', monospace;
        }

        .badge-sheet {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(9,180,232,0.25);
            color: #09B4E8;
            border: 1px solid rgba(9,180,232,0.4);
            white-space: nowrap;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .field {
            padding: 14px 20px;
            border-bottom: 1px solid #f3f4f6;
            border-right: 1px solid #f3f4f6;
        }
        .field:nth-child(even) { border-right: none; }
        .field.wide {
            grid-column: 1 / -1;
            border-right: none;
        }
        .field:last-child, .field.wide:last-child { border-bottom: none; }

        .field-label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 4px;
        }

        .field-value { font-size: 14px; color: #111; font-weight: 500; }
        .field-value.empty { color: #d1d5db; font-style: italic; font-weight: 400; }

        /* ── NOT FOUND ── */
        #not-found {
            display: none;
            background: #fff;
            border: 1px solid #fecaca;
            border-radius: 12px;
            text-align: center;
            padding: 48px 32px;
        }

        #not-found .code {
            font-size: 48px;
            font-weight: 700;
            color: #fecaca;
        }

        #not-found p { color: #9ca3af; font-size: 13px; margin-top: 8px; }

        /* ── CACHE INFO ── */
        .cache-info {
            font-size: 11px;
            color: #9ca3af;
        }
        .cache-info a { color: #09B4E8; text-decoration: none; }
        .cache-info a:hover { text-decoration: underline; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeUp 0.25s ease forwards; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">
        <div class="logo-icon">📡</div>
        <div>
            <div class="logo-title">LectoREE</div>
            <div class="logo-sub">Trazabilidad de equipos · Bjumper</div>
        </div>
    </div>
    <div class="status-badge status-off" id="statusBadge">Desconectado</div>
</div>

<div class="main">

    <!-- LOGIN -->
    <div id="login-section">
        <div class="login-icon"></div>
        <h2>AUTENTICACIÓN REQUERIDA</h2>
        <p>Usa tu cuenta corporativa de Bjumper para acceder</p>
        <button class="btn-primary" onclick="login()">⬡ &nbsp;INICIAR SESIÓN</button>
    </div>

    <!-- APP -->
    <div id="app-section" style="display:none;">

        <div class="search-card">
            <div class="search-label">Introduce o escanea el número de serie</div>
            <div class="search-row">
                <input type="text" id="serial-input" placeholder="Nº DE SERIE..." autocomplete="off" />
                <button id="search-btn" onclick="search()">BUSCAR</button>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p id="loading-msg">CARGANDO DATOS...</p>
        </div>

        <div id="result-section"></div>

        <div id="not-found">
            <div class="code">404</div>
            <p>Número de serie no encontrado en ninguna pestaña</p>
        </div>

        <div class="cache-info" id="cache-info"></div>

    </div>
</div>

<script>
// ── CONFIGURACIÓN ──────────────────────────────────────────
const CFG = {
    clientId: "d589d2d8-ab17-4602-a539-bfa628f5d64b",
    tenantId: "709f022e-4ae7-45d8-93ce-3070ff919136",
    siteHost: "bjumper.sharepoint.com",
    sitePath: "/sites/COMPRAS-LOGISTICA",
    fileName: "Seguimiento de N de serie GPS-RX-TX.xls",
    sheets: {
        "P3690 GPS NUEVO": [
            "NUMEROS\nDE SERIE",
            "NUMERO DE ORDEN",
            "TOTAL\nUNIDADES",
            "FECHA DE\nSALIDA",
            "FABRICADO PARA",
            "FIRMWARE EQUIPO",
            "RECEPTOR TRIMBLE\nFIRMWARE APLIC.",
            "RECEPTOR TRIMBLE\nFECHA",
            "OBSERVACIONES"
        ],
        "RX": [
            "NUMEROS\nDE SERIE",
            "NUMERO DE OBRA\nDE PRODUCCION",
            "TOTAL\nUNIDADES",
            "FECHA DE\nSALIDA",
            "FABRICADO PARA",
            "OBSERVACIONES"
        ],
        "TX": [
            "NUMEROS\nDE SERIE",
            "NUMERO DE OBRA\nDE PRODUCCION",
            "TOTAL\nUNIDADES",
            "FECHA DE\nSALIDA",
            "FABRICADO PARA",
            "OBSERVACIONES"
        ]
    }
};

const SCOPES = ["https://graph.microsoft.com/Files.Read.All"];

// ── MSAL ───────────────────────────────────────────────────
const msalApp = new msal.PublicClientApplication({
    auth: {
        clientId:    CFG.clientId,
        authority:   `https://login.microsoftonline.com/${CFG.tenantId}`,
        redirectUri: 'https://jmorenobj.github.io/LogControl/LectoREE.html'
    },
    cache: { cacheLocation: "sessionStorage" }
});

let excelCache = null;
let cacheTime  = null;

async function login() {
    try {
        await msalApp.loginRedirect({ scopes: SCOPES });
    } catch (e) {
        alert("Error al iniciar sesión:\n" + e.message);
    }
}

async function getToken() {
    const account = msalApp.getAllAccounts()[0];
    if (!account) throw new Error("Sesión expirada. Recarga la página.");
    try {
        const res = await msalApp.acquireTokenSilent({ scopes: SCOPES, account });
        return res.accessToken;
    } catch (e) {
        await msalApp.acquireTokenRedirect({ scopes: SCOPES, account });
    }
}

function onLoggedIn() {
    document.getElementById("login-section").style.display = "none";
    document.getElementById("app-section").style.display   = "block";
    const b = document.getElementById("statusBadge");
    b.className = "status-badge status-ok";
    b.textContent = "Conectado";

    const input = document.getElementById("serial-input");
    input.focus();
    input.addEventListener("keydown", e => { if (e.key === "Enter") search(); });

    loadExcel(); // precarga en background
}

// ── EXCEL ──────────────────────────────────────────────────
async function loadExcel(force = false) {
    if (excelCache && !force) return excelCache;

    showLoading("DESCARGANDO DATOS DE SHAREPOINT...");

    try {
        const token = await getToken();
        const headers = { Authorization: "Bearer " + token };

        // Paso 1: resolver el ID real del sitio
        const siteRes = await fetch(`https://graph.microsoft.com/v1.0/sites/${CFG.siteHost}:${CFG.sitePath}`, { headers });
        if (!siteRes.ok) throw new Error(`Site HTTP ${siteRes.status} — ${(await siteRes.text()).substring(0, 300)}`);
        const siteData = await siteRes.json();
        const siteId = siteData.id;

        // Paso 2: buscar fichero por nombre en el drive del sitio
        const searchRes = await fetch(`https://graph.microsoft.com/v1.0/sites/${siteId}/drive/search(q='${encodeURIComponent(CFG.fileName)}')`, { headers });
        if (!searchRes.ok) throw new Error(`Búsqueda HTTP ${searchRes.status} — ${(await searchRes.text()).substring(0, 300)}`);
        const searchData = await searchRes.json();
        const fileItem = (searchData.value || []).find(f => f.name === CFG.fileName);
        if (!fileItem) throw new Error(`Fichero "${CFG.fileName}" no encontrado`);

        // Paso 3: descargar por ID
        const res = await fetch(`https://graph.microsoft.com/v1.0/sites/${siteId}/drive/items/${fileItem.id}/content`, { headers });
        if (!res.ok) throw new Error(`Descarga HTTP ${res.status} — ${(await res.text()).substring(0, 300)}`);

        const workbook = XLSX.read(await res.arrayBuffer(), { type: "array", cellDates: true });

        excelCache = {};
        for (const sheetName of Object.keys(CFG.sheets)) {
            const ws = workbook.Sheets[sheetName];
            if (ws) excelCache[sheetName] = XLSX.utils.sheet_to_json(ws, { defval: "", range: 6 });
        }

        cacheTime = new Date();

        hideLoading();
        updateCacheInfo();
        return excelCache;

    } catch (e) {
        hideLoading();
        alert("Error al leer el Excel:\n" + e.message);
        return null;
    }
}

// ── BÚSQUEDA ───────────────────────────────────────────────

// Dado "RX2511001-RX2511100" y query "RX2511005", devuelve true
function matchesSN(cell, query) {
    const c = String(cell ?? "").trim();
    const q = query.trim();

    // Coincidencia exacta
    if (c.toLowerCase() === q.toLowerCase()) return true;

    // Rango: separar por guión
    const dash = c.indexOf("-");
    if (dash === -1) return false;

    const startStr = c.slice(0, dash).trim();
    const endRaw   = c.slice(dash + 1).trim();

    // El final puede ser "RX2511100" o solo "2511100"
    // Si no tiene letras, toma el prefijo del inicio
    const prefix = startStr.match(/^[A-Za-z]+/)?.[0] ?? "";
    const endStr = /^[A-Za-z]/.test(endRaw) ? endRaw : prefix + endRaw;

    const startNum = parseInt(startStr.replace(/^[A-Za-z]+/, ""), 10);
    const endNum   = parseInt(endStr.replace(/^[A-Za-z]+/, ""), 10);
    const qNum     = parseInt(q.replace(/^[A-Za-z]+/, ""), 10);
    const qPrefix  = q.match(/^[A-Za-z]+/)?.[0] ?? "";

    if (isNaN(startNum) || isNaN(endNum) || isNaN(qNum)) return false;
    if (qPrefix.toLowerCase() !== prefix.toLowerCase()) return false;

    return qNum >= startNum && qNum <= endNum;
}

async function search() {
    const raw = document.getElementById("serial-input").value.trim();
    if (!raw) return;

    document.getElementById("result-section").style.display = "none";
    document.getElementById("not-found").style.display      = "none";

    const data = await loadExcel();
    if (!data) return;

    for (const [sheetName, rows] of Object.entries(data)) {
        const colSN = CFG.sheets[sheetName][0];
        const match = rows.find(r => matchesSN(r[colSN], raw));
        if (match) { renderResult(match, sheetName); return; }
    }

    document.getElementById("not-found").style.display = "block";
    document.getElementById("not-found").classList.add("fade-in");
}

// ── RENDER ─────────────────────────────────────────────────
function renderResult(row, sheetName) {
    const cols    = CFG.sheets[sheetName];
    const snValue = String(row[cols[0]] ?? "").trim();

    const fields = cols.slice(1).map(col => {
        let value = row[col];
        if (value instanceof Date) {
            value = value.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
        } else {
            value = String(value ?? "").trim();
        }
        const wide = col === "OBSERVACIONES";
        return `<div class="field ${wide ? "wide" : ""}">
                    <div class="field-label">${esc(col)}</div>
                    <div class="field-value ${!value ? "empty" : ""}">${value ? esc(value) : "—"}</div>
                </div>`;
    }).join("");

    const s = document.getElementById("result-section");
    s.innerHTML = `
        <div class="fade-in">
            <div class="result-header">
                <div class="result-sn">${esc(snValue)}</div>
                <div class="badge">${esc(sheetName)}</div>
            </div>
            <div class="fields-grid">${fields}</div>
        </div>`;
    s.style.display = "block";
}

// ── HELPERS ────────────────────────────────────────────────
function showLoading(msg) {
    document.getElementById("loading-msg").textContent      = msg;
    document.getElementById("loading").style.display        = "block";
    document.getElementById("result-section").style.display = "none";
    document.getElementById("not-found").style.display      = "none";
}

function hideLoading() { document.getElementById("loading").style.display = "none"; }

function updateCacheInfo() {
    if (!cacheTime) return;
    document.getElementById("cache-info").innerHTML =
        `DATOS CARGADOS: ${cacheTime.toLocaleTimeString("es-ES")} &nbsp;|&nbsp; <a href="#" onclick="reload(event)">ACTUALIZAR</a>`;
}

function reload(e) { e.preventDefault(); excelCache = null; loadExcel(true); }

function esc(s) {
    return String(s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── INIT ───────────────────────────────────────────────────
(async () => {
    await msalApp.initialize();
    const result = await msalApp.handleRedirectPromise();
    if (result) {
        onLoggedIn();
    } else if (msalApp.getAllAccounts().length > 0) {
        onLoggedIn();
    }
})();
</script>
</body>
</html>
