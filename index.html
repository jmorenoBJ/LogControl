<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogControl — Panel de Logística</title>
<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #F5F6F8; color: #1a1a1a; font-size: 14px; min-height: 100vh; }

.topbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 34px; height: 34px; background: #0078d4; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.logo-icon svg { width: 18px; height: 18px; }
.logo-title { font-size: 17px; font-weight: 700; color: #111; letter-spacing: -0.3px; }
.logo-sub { font-size: 11px; color: #6b7280; margin-top: 1px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
.status-ok   { color: #059669; background: #ecfdf5; border-color: #a7f3d0; }
.status-warn { color: #d97706; background: #fffbeb; border-color: #fde68a; }
.status-err  { color: #dc2626; background: #fef2f2; border-color: #fecaca; }
.status-badge::before { content:''; width:7px; height:7px; border-radius:50%; display:inline-block; background:currentColor; }
.user-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #374151; background: #f3f4f6; padding: 5px 12px; border-radius: 20px; }
.btn-sm { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 12px; color: #374151; cursor: pointer; }
.btn-sm:hover { background: #f3f4f6; }

.main { max-width: 1400px; margin: 0 auto; padding: 24px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 24px; }
.kpi { background:#fff; border-radius:12px; border:1px solid #e5e7eb; padding:16px 20px; }
.kpi-label { font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.kpi-val { font-size:32px; font-weight:700; color:#111; line-height:1; }
.kpi-sub { font-size:11px; color:#9ca3af; margin-top:4px; }
.kpi-val.amber { color:#d97706; }
.kpi-val.red   { color:#dc2626; }

.card { background:#fff; border-radius:12px; border:1px solid #e5e7eb; overflow:hidden; }

.tabs { display:flex; gap:4px; background:#f3f4f6; border-radius:8px; padding:3px; margin-bottom:20px; }
.tab { flex:1; padding:8px 14px; border:none; background:none; border-radius:6px; font-size:13px; font-weight:500; color:#6b7280; cursor:pointer; text-align:center; transition:all .15s; position:relative; }
.tab.active { background:#fff; color:#111; box-shadow:0 1px 3px rgba(0,0,0,.1); }
.tab-badge { position:absolute; top:4px; right:8px; background:#dc2626; color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:10px; line-height:1.4; }

.toolbar { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid #f3f4f6; flex-wrap:wrap; }
.search-input { padding:8px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:13px; width:270px; background:#fafafa; color:#111; outline:none; font-family:inherit; }
.search-input:focus { border-color:#0078d4; background:#fff; }
.filter-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip { padding:4px 10px; border-radius:20px; border:1px solid #d1d5db; background:#fff; font-size:11px; font-weight:500; color:#374151; cursor:pointer; transition:all .15s; }
.chip:hover { background:#f9fafb; }
.chip.active { background:#0078d4; color:#fff; border-color:#0078d4; }
.btn-add { padding:8px 16px; background:#0078d4; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
.btn-add:hover { background:#006bb8; }
.btn-add:disabled { background:#93c5fd; cursor:not-allowed; }

.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead { background:#f9fafb; }
th { padding:10px 14px; font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; text-align:left; white-space:nowrap; border-bottom:1px solid #e5e7eb; }
td { padding:11px 14px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:#fafafa; }
tr.row-vencida td { background:#fff5f5; }
tr.row-vencida:hover td { background:#fee2e2; }
.td-clip { max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.b-aereo      { background:#eff6ff; color:#1d4ed8; }
.b-maritimo   { background:#f0fdf4; color:#166534; }
.b-transito   { background:#fffbeb; color:#92400e; }
.b-aduana     { background:#fff7ed; color:#9a3412; }
.b-entregado  { background:#f0fdf4; color:#166534; }
.b-pendiente  { background:#f9fafb; color:#4b5563; border:1px solid #e5e7eb; }
.b-alta       { background:#fef2f2; color:#991b1b; }
.b-media      { background:#fffbeb; color:#92400e; }
.b-baja       { background:#f0fdf4; color:#166534; }
.b-enproceso  { background:#eff6ff; color:#1d4ed8; }
.b-terminado  { background:#f0fdf4; color:#166534; }

.eta-near { color:#d97706; font-weight:600; }
.eta-late  { color:#dc2626; font-weight:600; }
.link-tr { color:#0078d4; text-decoration:none; font-size:12px; }
.link-tr:hover { text-decoration:underline; }

.action-btn { padding:4px 10px; border-radius:6px; border:1px solid #e5e7eb; background:#fff; font-size:11px; font-weight:500; color:#374151; cursor:pointer; margin-right:4px; }
.action-btn:hover { background:#f3f4f6; }
.action-del { color:#dc2626; border-color:#fecaca; }
.action-del:hover { background:#fef2f2; }
.action-done { color:#059669; border-color:#a7f3d0; }
.action-done:hover { background:#ecfdf5; }

.empty { text-align:center; padding:40px; color:#9ca3af; font-size:14px; }
.loading { text-align:center; padding:40px; color:#6b7280; }
.spin { display:inline-block; width:20px; height:20px; border:2px solid #e5e7eb; border-top-color:#0078d4; border-radius:50%; animation:spin .7s linear infinite; margin-bottom:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ALERTA BANNER */
.alert-banner { display:flex; align-items:center; gap:10px; padding:12px 20px; background:#fef2f2; border-bottom:1px solid #fecaca; font-size:13px; color:#991b1b; }
.alert-banner strong { font-weight:600; }

/* LOGIN */
.login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F5F6F8; }
.login-card { background:#fff; border-radius:16px; border:1px solid #e5e7eb; padding:40px 48px; text-align:center; max-width:420px; width:100%; }
.login-icon { width:56px; height:56px; background:#0078d4; border-radius:14px; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; }
.login-title { font-size:22px; font-weight:700; color:#111; margin-bottom:8px; }
.login-sub { font-size:14px; color:#6b7280; margin-bottom:28px; line-height:1.6; }
.btn-login { width:100%; padding:12px; background:#0078d4; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
.btn-login:hover { background:#006bb8; }

/* CONFIG */
.config-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F5F6F8; padding:24px; }
.config-card { background:#fff; border-radius:16px; border:1px solid #e5e7eb; padding:36px 40px; max-width:540px; width:100%; }
.config-title { font-size:20px; font-weight:700; color:#111; margin-bottom:6px; }
.config-sub { font-size:13px; color:#6b7280; margin-bottom:24px; line-height:1.6; }
.cfg-section { margin-bottom:20px; }
.cfg-section h3 { font-size:12px; font-weight:700; color:#374151; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid #f3f4f6; }
.fg { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.fg label { font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; }
.fg input { font-size:13px; padding:9px 11px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#111; width:100%; outline:none; font-family:inherit; }
.fg input:focus { border-color:#0078d4; }
.fg .hint { font-size:11px; color:#9ca3af; margin-top:2px; line-height:1.5; }
.btn-primary { width:100%; padding:11px; background:#0078d4; color:#fff; border:none; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; }
.btn-primary:hover { background:#006bb8; }
.alert-info { background:#eff6ff; color:#1d4ed8; border:1px solid #bfdbfe; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:20px; line-height:1.6; }
.alert-err  { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }

/* MODAL */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px; }
.modal { background:#fff; border-radius:14px; width:100%; max-width:580px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.modal-hd { padding:20px 24px 16px; border-bottom:1px solid #f3f4f6; }
.modal-title { font-size:17px; font-weight:700; color:#111; }
.modal-bd { padding:20px 24px; }
.modal-ft { padding:14px 24px 20px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #f3f4f6; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.mfg { display:flex; flex-direction:column; gap:5px; }
.mfg.full { grid-column:1/-1; }
.mfg label { font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; }
.mfg input, .mfg select, .mfg textarea { font-size:13px; padding:9px 11px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#111; width:100%; outline:none; font-family:inherit; }
.mfg input:focus, .mfg select:focus, .mfg textarea:focus { border-color:#0078d4; }
.mfg textarea { height:72px; resize:vertical; }
.mfg .hint { font-size:11px; color:#9ca3af; margin-top:2px; }
.btn-cancel { padding:8px 16px; border:1px solid #d1d5db; border-radius:8px; background:#fff; font-size:13px; font-weight:500; color:#374151; cursor:pointer; }
.btn-cancel:hover { background:#f9fafb; }
.btn-save { padding:8px 18px; background:#0078d4; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
.btn-save:hover { background:#006bb8; }
.btn-save:disabled { background:#93c5fd; cursor:not-allowed; }

@media(max-width:600px){
  .main { padding:16px; }
  .form-grid { grid-template-columns:1fr; }
  .mfg.full { grid-column:1; }
  .search-input { width:100%; }
  .login-card, .config-card { padding:28px 24px; }
}
</style>
</head>
<body>
<div id="appRoot"></div>

<!-- MODAL ENVÍO -->
<div class="modal-overlay" id="modalE" style="display:none" onclick="olc(event,'modalE')">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title" id="titleModalE">Nuevo envío</div></div>
    <div class="modal-bd">
      <div class="form-grid">
        <div class="mfg full">
          <label>Título del envío</label>
          <input id="eTitle" placeholder="Ej: Barco Mayo 2026 / DHL Hong Kong junio">
        </div>
        <div class="mfg">
          <label>Tipo de envío</label>
          <select id="eTipo"><option value="Aéreo">✈ Aéreo</option><option value="Marítimo">⚓ Marítimo</option></select>
        </div>
        <div class="mfg">
          <label>Estado</label>
          <select id="eEstado">
            <option value="En tránsito">En tránsito</option>
            <option value="En aduana">En aduana</option>
            <option value="Entregado">Entregado</option>
            <option value="Pendiente">Pendiente</option>
          </select>
        </div>
        <div class="mfg"><label>Origen</label><input id="eOrigen" placeholder="Ej: Shanghai / Hong Kong"></div>
        <div class="mfg"><label>Destino</label><input id="eDestino" placeholder="Ej: Valencia / Madrid"></div>
        <div class="mfg"><label>Proveedor / Naviera</label><input id="eProveedor" placeholder="Ej: Maersk, DHL, FedEx…"></div>
        <div class="mfg"><label>ETA — Fecha estimada de llegada</label><input type="date" id="eETA"></div>
        <div class="mfg full">
          <label>Seguimiento (enlace de tracking)</label>
          <input id="eSeguimiento" type="url" placeholder="https://www.track.maersk.com/…">
        </div>
        <div class="mfg full">
          <label>PCs Asociados (órdenes de compra)</label>
          <textarea id="ePCs" placeholder="Ej: OC-2024-441, OC-2024-445"></textarea>
        </div>
        <div class="mfg full"><label>Notas</label><textarea id="eNotas" placeholder="Observaciones adicionales…"></textarea></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="cm('modalE')">Cancelar</button>
      <button class="btn-save" id="btnSaveE" onclick="saveEnvio()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL PEDIDO -->
<div class="modal-overlay" id="modalP" style="display:none" onclick="olc(event,'modalP')">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title" id="titleModalP">Nuevo pedido de cliente</div></div>
    <div class="modal-bd">
      <div class="form-grid">
        <div class="mfg"><label>Título</label><input id="pTitle" placeholder="Ej: García mayo / PED-0001"></div>
        <div class="mfg"><label>Cliente</label><input id="pCliente" placeholder="Nombre de la empresa"></div>
        <div class="mfg full"><label>Producto / Descripción</label><input id="pProducto" placeholder="Qué ha pedido el cliente"></div>
        <div class="mfg"><label>Proveedor</label><input id="pProveedor" placeholder="Proveedor del producto"></div>
        <div class="mfg">
          <label>Pedido de Venta (envío asociado)</label>
          <select id="pPedidoVenta"></select>
        </div>
        <div class="mfg"><label>ETA Cliente — Fecha compromiso</label><input type="date" id="pETACliente"></div>
        <div class="mfg full"><label>Notas</label><textarea id="pNotas" placeholder="Observaciones…"></textarea></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="cm('modalP')">Cancelar</button>
      <button class="btn-save" id="btnSaveP" onclick="savePedido()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL TAREA -->
<div class="modal-overlay" id="modalT" style="display:none" onclick="olc(event,'modalT')">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title" id="titleModalT">Nueva tarea</div></div>
    <div class="modal-bd">
      <div class="form-grid">
        <div class="mfg full"><label>Título de la tarea</label><input id="tTitle" placeholder="Ej: Revisar documentos aduana barco mayo"></div>
        <div class="mfg full">
          <label>Descripción</label>
          <textarea id="tDescripcion" placeholder="Detalle de lo que hay que hacer…"></textarea>
        </div>
        <div class="mfg"><label>Asignado a</label><input id="tAsignado" placeholder="Nombre del compañero"></div>
        <div class="mfg"><label>Fecha límite</label><input type="date" id="tFechaLimite"></div>
        <div class="mfg">
          <label>Prioridad</label>
          <select id="tPrioridad">
            <option value="Alta">🔴 Alta</option>
            <option value="Media">🟡 Media</option>
            <option value="Baja">🟢 Baja</option>
          </select>
        </div>
        <div class="mfg">
          <label>Estado</label>
          <select id="tEstado">
            <option value="Pendiente">Pendiente</option>
            <option value="En proceso">En proceso</option>
            <option value="Terminado">Terminado</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="cm('modalT')">Cancelar</button>
      <button class="btn-save" id="btnSaveT" onclick="saveTarea()">Guardar</button>
    </div>
  </div>
</div>

<script>
const CFG = {
  clientId: localStorage.getItem('lc_clientId') || '',
  tenantId: localStorage.getItem('lc_tenantId') || '',
  siteUrl:  localStorage.getItem('lc_siteUrl')  || ''
};

// Nombres internos SharePoint
const FE = {
  title:'Title', tipo:'Tipo_x0020_de_x0020_Envio', origen:'Origen', destino:'Destino',
  proveedor:'Proveedor', estado:'Estado', eta:'ETA', seguimiento:'Seguimiento',
  pcs:'PCs_x0020_Asociados', notas:'Notas'
};
const FP = {
  title:'Title', cliente:'Cliente', producto:'Producto', proveedor:'Proveedor',
  pedidoVenta:'Pedido_x0020_de_x0020_Venta', etaCliente:'ETA_x0020_Cliente', notas:'Notas'
};
const FT = {
  title:'Title', descripcion:'Descripcion', asignado:'Asignado',
  fechaLimite:'Fecha_x0020_Limite', prioridad:'Prioridad', estado:'Estado'
};

let msalInstance = null, accessToken = null, currentUser = null;
let envios = [], pedidos = [], tareas = [];
let editEId = null, editPId = null, editTId = null;
let filterE = 'todos', filterT = 'todos';
let etypeE = 'SP.Data.EnviosListItem';
let etypeP = 'SP.Data.PedidosListItem';
let etypeT = 'SP.Data.Tareas_x0020_PendientesListItem';

function render() {
  if (!CFG.clientId || !CFG.tenantId || !CFG.siteUrl) showConfigScreen();
  else initMsal();
}

// ── CONFIG ─────────────────────────────────────────────
function showConfigScreen(error) {
  document.getElementById('appRoot').innerHTML = `
    <div class="config-screen">
      <div class="config-card">
        <div class="config-title">Configuración inicial</div>
        <div class="config-sub">Introduce los datos de tu tenant de Microsoft 365.</div>
        ${error ? `<div class="alert-err">⚠ ${error}</div>` : ''}
        <div class="alert-info">Necesitas registrar una app en Azure AD (Microsoft Entra ID) y añadir la URL de GitHub Pages como redirect URI de tipo SPA.</div>
        <div class="cfg-section">
          <h3>Azure AD</h3>
          <div class="fg"><label>Client ID</label><input id="cfgClientId" value="${CFG.clientId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><div class="hint">Azure Portal → App registrations → tu app → Application (client) ID</div></div>
          <div class="fg"><label>Tenant ID</label><input id="cfgTenantId" value="${CFG.tenantId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><div class="hint">Azure Portal → App registrations → tu app → Directory (tenant) ID</div></div>
        </div>
        <div class="cfg-section">
          <h3>SharePoint</h3>
          <div class="fg"><label>URL del sitio</label><input id="cfgSiteUrl" value="${CFG.siteUrl}" placeholder="https://tuempresa.sharepoint.com/sites/COMPRAS-LOGISTICA"><div class="hint">URL base del sitio, sin barra al final</div></div>
        </div>
        <button class="btn-primary" onclick="saveConfig()">Guardar y conectar</button>
      </div>
    </div>`;
}

function saveConfig() {
  const clientId = document.getElementById('cfgClientId').value.trim();
  const tenantId = document.getElementById('cfgTenantId').value.trim();
  const siteUrl  = document.getElementById('cfgSiteUrl').value.trim().replace(/\/$/,'');
  if (!clientId || !tenantId || !siteUrl) { alert('Rellena todos los campos.'); return; }
  CFG.clientId = clientId; CFG.tenantId = tenantId; CFG.siteUrl = siteUrl;
  localStorage.setItem('lc_clientId', clientId);
  localStorage.setItem('lc_tenantId', tenantId);
  localStorage.setItem('lc_siteUrl',  siteUrl);
  initMsal();
}

// ── MSAL ───────────────────────────────────────────────
function initMsal() {
  msalInstance = new msal.PublicClientApplication({
    auth: { clientId: CFG.clientId, authority: `https://login.microsoftonline.com/${CFG.tenantId}`, redirectUri: window.location.origin + window.location.pathname },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
  });
  msalInstance.handleRedirectPromise().then(response => {
    if (response) { accessToken = response.accessToken; currentUser = response.account; showApp(); loadAll(); }
    else {
      const accounts = msalInstance.getAllAccounts();
      if (accounts.length > 0) { currentUser = accounts[0]; acquireToken().then(() => { showApp(); loadAll(); }).catch(() => showLoginScreen()); }
      else showLoginScreen();
    }
  }).catch(err => showConfigScreen('Error de autenticación: ' + err.message));
}

async function acquireToken() {
  const scopes = ['https://bjumper.sharepoint.com/.default'];
  try { const r = await msalInstance.acquireTokenSilent({ scopes, account: currentUser }); accessToken = r.accessToken; }
  catch(e) { const r = await msalInstance.acquireTokenPopup({ scopes }); accessToken = r.accessToken; currentUser = r.account; }
}

function showLoginScreen() {
  document.getElementById('appRoot').innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <div class="login-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 17h18M3 12l9-9 9 9"/></svg></div>
        <div class="login-title">LogControl</div>
        <div class="login-sub">Panel de logística para envíos aéreos y marítimos.<br>Inicia sesión con tu cuenta de Microsoft.</div>
        <button class="btn-login" onclick="login()">

// ── SP API ─────────────────────────────────────────────
async function spFetch(url, options={}) {
  await acquireToken();
  return fetch(url, { ...options, headers: { 'Accept':'application/json;odata=verbose', 'Authorization':`Bearer ${accessToken}`, ...(options.headers||{}) } });
}
async function getDigest() {
  const r = await spFetch(`${CFG.siteUrl}/_api/contextinfo`, { method:'POST', headers:{'Content-Type':'application/json;odata=verbose'} });
  if (!r.ok) throw new Error('No se pudo obtener digest.');
  return (await r.json()).d.GetContextWebInformation.FormDigestValue;
}
async function getEtypes() {
  try {
    const [re,rp,rt] = await Promise.all([
      spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('Envios')?$select=ListItemEntityTypeFullName`),
      spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('Pedidos')?$select=ListItemEntityTypeFullName`),
      spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('Tareas Pendientes')?$select=ListItemEntityTypeFullName`)
    ]);
    if (re.ok) etypeE = (await re.json()).d.ListItemEntityTypeFullName;
    if (rp.ok) etypeP = (await rp.json()).d.ListItemEntityTypeFullName;
    if (rt.ok) etypeT = (await rt.json()).d.ListItemEntityTypeFullName;
  } catch(e) { console.warn('Entity types por defecto.'); }
}
async function spGet(list) {
  const r = await spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('${list}')/items?$select=*&$top=500&$orderby=Id desc`);
  if (!r.ok) throw new Error(`Error leyendo "${list}" (${r.status})`);
  return (await r.json()).d.results;
}
async function spCreate(list, etype, fields) {
  const dg = await getDigest();
  const r = await spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('${list}')/items`, {
    method:'POST', headers:{'Content-Type':'application/json;odata=verbose','X-RequestDigest':dg},
    body: JSON.stringify({ __metadata:{type:etype}, ...fields })
  });
  if (!r.ok) { const t=await r.text(); throw new Error(t); }
  return await r.json();
}
async function spUpdate(list, id, etype, fields) {
  const dg = await getDigest();
  const r = await spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('${list}')/items(${id})`, {
    method:'POST', headers:{'Content-Type':'application/json;odata=verbose','X-RequestDigest':dg,'X-HTTP-Method':'MERGE','If-Match':'*'},
    body: JSON.stringify({ __metadata:{type:etype}, ...fields })
  });
  if (!r.ok && r.status!==204) throw new Error(`Error al actualizar (${r.status})`);
}
async function spDelete(list, id) {
  const dg = await getDigest();
  const r = await spFetch(`${CFG.siteUrl}/_api/web/lists/getbytitle('${list}')/items(${id})`, {
    method:'POST', headers:{'X-RequestDigest':dg,'X-HTTP-Method':'DELETE','If-Match':'*'}
  });
  if (!r.ok && r.status!==204) throw new Error(`Error al eliminar (${r.status})`);
}

// ── MAPPERS ────────────────────────────────────────────
function rowToEnvio(i) { return { id:i.Id, title:i[FE.title]||'', tipo:i[FE.tipo]||'', origen:i[FE.origen]||'', destino:i[FE.destino]||'', proveedor:i[FE.proveedor]||'', estado:i[FE.estado]||'', eta:i[FE.eta]?i[FE.eta].split('T')[0]:'', seguimiento:i[FE.seguimiento]||'', pcs:i[FE.pcs]||'', notas:i[FE.notas]||'' }; }
function envioToRow(e) { return { [FE.title]:e.title,[FE.tipo]:e.tipo,[FE.origen]:e.origen,[FE.destino]:e.destino,[FE.proveedor]:e.proveedor,[FE.estado]:e.estado,[FE.eta]:e.eta?e.eta+'T00:00:00Z':null,[FE.seguimiento]:e.seguimiento,[FE.pcs]:e.pcs,[FE.notas]:e.notas }; }
function rowToPedido(i) { return { id:i.Id, title:i[FP.title]||'', cliente:i[FP.cliente]||'', producto:i[FP.producto]||'', proveedor:i[FP.proveedor]||'', pedidoVenta:i[FP.pedidoVenta]||'', etaCliente:i[FP.etaCliente]?i[FP.etaCliente].split('T')[0]:'', notas:i[FP.notas]||'' }; }
function pedidoToRow(p) { return { [FP.title]:p.title,[FP.cliente]:p.cliente,[FP.producto]:p.producto,[FP.proveedor]:p.proveedor,[FP.pedidoVenta]:p.pedidoVenta,[FP.etaCliente]:p.etaCliente?p.etaCliente+'T00:00:00Z':null,[FP.notas]:p.notas }; }
function rowToTarea(i) { return { id:i.Id, title:i[FT.title]||'', descripcion:i[FT.descripcion]||'', asignado:i[FT.asignado]||'', fechaLimite:i[FT.fechaLimite]?i[FT.fechaLimite].split('T')[0]:'', prioridad:i[FT.prioridad]||'', estado:i[FT.estado]||'' }; }
function tareaToRow(t) { return { [FT.title]:t.title,[FT.descripcion]:t.descripcion,[FT.asignado]:t.asignado,[FT.fechaLimite]:t.fechaLimite?t.fechaLimite+'T00:00:00Z':null,[FT.prioridad]:t.prioridad,[FT.estado]:t.estado }; }

// ── CARGA ──────────────────────────────────────────────
async function loadAll() {
  setStatus('warn','Conectando…');
  try {
    await getEtypes();
    const [rawE,rawP,rawT] = await Promise.all([spGet('Envios'),spGet('Pedidos'),spGet('Tareas Pendientes')]);
    envios  = rawE.map(rowToEnvio);
    pedidos = rawP.map(rowToPedido);
    tareas  = rawT.map(rowToTarea);
    const hora = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    setStatus('ok',`Conectado · ${hora}`);
    renderKPIs(); renderAlertBanner(); renderEnvios(); renderPedidos(); renderTareas();
    const loadE = document.getElementById('loadE');
    const tableE = document.getElementById('tableE');
    if(loadE) loadE.style.display='none';
    if(tableE) tableE.style.display='';
  } catch(err) {
    setStatus('err','Error de conexión');
    const loadE = document.getElementById('loadE');
    if(loadE) loadE.innerHTML=`<div style="color:#dc2626;padding:24px;text-align:center">⚠ ${err.message}<br><br><button class="btn-add" onclick="loadAll()">Reintentar</button></div>`;
    console.error(err);
  }
}

// ── KPIs Y ALERTAS ─────────────────────────────────────
function renderKPIs() {
  const today = new Date(); today.setHours(0,0,0,0);
  const transito = envios.filter(e=>e.estado==='En tránsito').length;
  const aduana   = envios.filter(e=>e.estado==='En aduana').length;
  const envVenc  = envios.filter(e=>e.eta && new Date(e.eta)<today && e.estado!=='Entregado').length;
  const pedVenc  = pedidos.filter(p=>p.etaCliente && new Date(p.etaCliente)<today).length;
  const tarPend  = tareas.filter(t=>t.estado!=='Terminado').length;

  const k1=document.getElementById('kpi1'); if(k1) k1.textContent=transito;
  const k2=document.getElementById('kpi2'); if(k2){k2.textContent=aduana;k2.className='kpi-val'+(aduana>0?' amber':'');}
  const k3=document.getElementById('kpi3'); if(k3){k3.textContent=envVenc;k3.className='kpi-val'+(envVenc>0?' red':'');}
  const k4=document.getElementById('kpi4'); if(k4){k4.textContent=pedVenc;k4.className='kpi-val'+(pedVenc>0?' red':'');}
  const k5=document.getElementById('kpi5'); if(k5){k5.textContent=tarPend;k5.className='kpi-val'+(tarPend>0?' amber':'');}

  // Badge en pestaña tareas
  const tarVenc = tareas.filter(t=>t.fechaLimite && new Date(t.fechaLimite)<today && t.estado!=='Terminado').length;
  const tabT = document.getElementById('tabT');
  if(tabT) {
    const existing = tabT.querySelector('.tab-badge');
    if(existing) existing.remove();
    if(tarVenc>0) tabT.insertAdjacentHTML('beforeend',`<span class="tab-badge">${tarVenc}</span>`);
  }
}

function renderAlertBanner() {
  const today = new Date(); today.setHours(0,0,0,0);
  const alerts = [];
  const envVenc = envios.filter(e=>e.eta && new Date(e.eta)<today && e.estado!=='Entregado');
  const pedVenc = pedidos.filter(p=>p.etaCliente && new Date(p.etaCliente)<today);
  const tarVenc = tareas.filter(t=>t.fechaLimite && new Date(t.fechaLimite)<today && t.estado!=='Terminado');
  if(envVenc.length) alerts.push(`<strong>${envVenc.length} envío(s)</strong> con ETA superada`);
  if(pedVenc.length) alerts.push(`<strong>${pedVenc.length} pedido(s)</strong> con fecha de compromiso superada`);
  if(tarVenc.length) alerts.push(`<strong>${tarVenc.length} tarea(s)</strong> vencida(s)`);
  const banner = document.getElementById('alertBanner');
  if(banner) banner.innerHTML = alerts.length ? `<div class="alert-banner">⚠ ${alerts.join(' · ')}</div>` : '';
}

// ── UTILS ──────────────────────────────────────────────
function setStatus(t,msg){const b=document.getElementById('statusBadge');if(!b)return;b.className='status-badge status-'+t;b.textContent=msg;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function formatDate(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});}catch{return d;}}
function etaClass(d){if(!d)return'';const today=new Date();today.setHours(0,0,0,0);const diff=(new Date(d)-today)/86400000;return diff<0?'eta-late':diff<=3?'eta-near':'';}
function olc(ev,id){if(ev.target.classList.contains('modal-overlay'))cm(id);}
function cm(id){document.getElementById(id).style.display='none';}

function badge(k, tipo) {
  const maps = {
    tipo:     { 'Aéreo':['b-aereo','✈ Aéreo'],'Marítimo':['b-maritimo','⚓ Marítimo'] },
    estado:   { 'En tránsito':['b-transito','En tránsito'],'En aduana':['b-aduana','En aduana'],'Entregado':['b-entregado','Entregado'],'Pendiente':['b-pendiente','Pendiente'] },
    prioridad:{ 'Alta':['b-alta','🔴 Alta'],'Media':['b-media','🟡 Media'],'Baja':['b-baja','🟢 Baja'] },
    estadoT:  { 'Pendiente':['b-pendiente','Pendiente'],'En proceso':['b-enproceso','En proceso'],'Terminado':['b-terminado','Terminado'] }
  };
  const map = maps[tipo] || {};
  const [cls,lbl] = map[k] || ['b-pendiente', k||'—'];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

// ── CRUD ───────────────────────────────────────────────
async function saveEnvio() {
  const btn=document.getElementById('btnSaveE');
  btn.disabled=true;btn.textContent='Guardando…';
  const item={title:document.getElementById('eTitle').value.trim(),tipo:document.getElementById('eTipo').value,estado:document.getElementById('eEstado').value,origen:document.getElementById('eOrigen').value.trim(),destino:document.getElementById('eDestino').value.trim(),proveedor:document.getElementById('eProveedor').value.trim(),eta:document.getElementById('eETA').value,seguimiento:document.getElementById('eSeguimiento').value.trim(),pcs:document.getElementById('ePCs').value.trim(),notas:document.getElementById('eNotas').value.trim()};
  if(!item.title){alert('El nombre es obligatorio.');btn.disabled=false;btn.textContent='Guardar';return;}
  try {
    if(editEId!==null){await spUpdate('Envios',editEId,etypeE,envioToRow(item));envios=envios.map(e=>e.id===editEId?{...item,id:editEId}:e);}
    else{const r=await spCreate('Envios',etypeE,envioToRow(item));envios.unshift({...item,id:r.d.Id});}
    cm('modalE');renderKPIs();renderAlertBanner();renderEnvios();
    setStatus('ok','Guardado ✓');setTimeout(()=>setStatus('ok','Conectado'),2000);
  } catch(err){alert('Error: '+err.message);}
  btn.disabled=false;btn.textContent='Guardar';
}

async function marcarTerminada(id) {
  try {
    await spUpdate('Tareas Pendientes',id,etypeT,{[FT.estado]:'Terminado'});
    tareas=tareas.map(t=>t.id===id?{...t,estado:'Terminado'}:t);
    renderKPIs();renderAlertBanner();renderTareas();
  } catch(err){alert('Error: '+err.message);}
}
async function delEnvio(id){if(!confirm('¿Eliminar este envío?'))return;try{await spDelete('Envios',id);envios=envios.filter(e=>e.id!==id);renderKPIs();renderAlertBanner();renderEnvios();}catch(err){alert('Error: '+err.message);}}
async function delPedido(id){if(!confirm('¿Eliminar este pedido?'))return;try{await spDelete('Pedidos',id);pedidos=pedidos.filter(p=>p.id!==id);renderKPIs();renderAlertBanner();renderPedidos();}catch(err){alert('Error: '+err.message);}}
async function delTarea(id){if(!confirm('¿Eliminar esta tarea?'))return;try{await spDelete('Tareas Pendientes',id);tareas=tareas.filter(t=>t.id!==id);renderKPIs();renderAlertBanner();renderTareas();}catch(err){alert('Error: '+err.message);}}

function switchTab(tab) {
  document.getElementById('panelEnvios').style.display  =tab==='envios' ?'':'none';
  document.getElementById('panelPedidos').style.display =tab==='pedidos'?'':'none';
  document.getElementById('panelTareas').style.display  =tab==='tareas' ?'':'none';
  ['tabE','tabP','tabT'].forEach((id,i)=>{
    const t=document.getElementById(id);
    if(t) t.classList.toggle('active',['envios','pedidos','tareas'][i]===tab);
  });
  if(tab==='tareas') renderTareas();
  if(tab==='pedidos') renderPedidos();
}

render();
